<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="100%" stop-color="#f5ede0" />
    </linearGradient>
    <linearGradient id="terracotta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ba5d43" />
      <stop offset="100%" stop-color="#8c3924" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6bd60" />
      <stop offset="100%" stop-color="#e29578" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8c3924" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#e8dcce" stroke-width="3" />

  <!-- Sunlit Halo behind desk -->
  <circle cx="360" cy="160" r="70" fill="url(#gold)" opacity="0.35" />
  <circle cx="360" cy="160" r="44" fill="url(#gold)" opacity="0.8" />

  <!-- Study Desk Surface / Base -->
  <path d="M96 360 L416 360 C424 360 430 366 430 374 L430 380 C430 388 424 394 416 394 L96 394 C88 394 82 388 82 380 L82 374 C82 366 88 360 96 360 Z" fill="#6d5d52" filter="url(#shadow)" />
  <path d="M124 394 L124 430 C124 434 120 438 116 438 L110 438 C106 438 102 434 102 430 L102 394 Z" fill="#584940" />
  <path d="M410 394 L410 430 C410 434 406 438 402 438 L396 438 C392 438 388 434 388 430 L388 394 Z" fill="#584940" />

  <!-- Open Study Notebook -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M144 230 C180 238 230 240 252 248 L252 344 C230 336 180 334 144 326 Z" fill="#ffffff" />
    <!-- Right Page -->
    <path d="M368 230 C332 238 282 240 260 248 L260 344 C282 336 332 334 368 326 Z" fill="#fdfbf7" />
    <!-- Spine binding -->
    <line x1="256" y1="248" x2="256" y2="344" stroke="#d5c8b7" stroke-width="4" stroke-linecap="round" />
    <!-- Notebook lines left -->
    <line x1="168" y1="262" x2="232" y2="270" stroke="#ebdccb" stroke-width="3" stroke-linecap="round" />
    <line x1="168" y1="282" x2="232" y2="290" stroke="#ebdccb" stroke-width="3" stroke-linecap="round" />
    <line x1="168" y1="302" x2="220" y2="308" stroke="#ebdccb" stroke-width="3" stroke-linecap="round" />
    <!-- Notebook lines right -->
    <line x1="280" y1="270" x2="344" y2="262" stroke="#ebdccb" stroke-width="3" stroke-linecap="round" />
    <line x1="280" y1="290" x2="344" y2="282" stroke="#ebdccb" stroke-width="3" stroke-linecap="round" />
    <line x1="280" y1="310" x2="332" y2="304" stroke="#ebdccb" stroke-width="3" stroke-linecap="round" />
    <!-- Terracotta Bookmark ribbon -->
    <path d="M256 248 L256 364 L264 356 L272 364 L272 250 Z" fill="url(#terracotta)" />
  </g>

  <!-- Warm Desk Lamp / Glow -->
  <path d="M150 360 C150 250 180 160 224 160 C234 160 240 166 238 176 C236 186 230 190 220 190 C188 190 170 260 170 360 Z" fill="#ba5d43" opacity="0.9" />
  <ellipse cx="224" cy="154" rx="28" ry="14" fill="#8c3924" transform="rotate(-18 224 154)" />
  <ellipse cx="224" cy="154" rx="20" ry="10" fill="#f6bd60" transform="rotate(-18 224 154)" />
</svg>